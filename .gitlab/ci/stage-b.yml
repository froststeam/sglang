stage-b:1gpu-musa:
  stage: stage-b
  extends:
    - .musa-1gpu-test-job
    - .rules-stage-b
  parallel:
    matrix:
      - PARTITION: ["0", "1"]
  script:
    - cd test
    - python3 run_suite.py --hw "$MUSA_RUN_SUITE_HW" --suite stage-b-test-1-gpu-musa --auto-partition-id "$PARTITION" --auto-partition-size 2

stage-b:musa-unit:
  stage: stage-b
  extends:
    - .musa-1gpu-test-job
    - .rules-stage-b
  parallel:
    matrix:
      - PARTITION: ["0", "1"]
  script:
    - cd test
    - echo "Run registered SGLang MUSA unit tests from test/registered"
    - python3 run_suite.py --hw "$MUSA_RUN_SUITE_HW" --suite stage-b-unit-1-gpu-musa --auto-partition-id "$PARTITION" --auto-partition-size 2
    - cd ..
    - echo "Run selected sgl-kernel MUSA unit tests"
    - |
      if [ "$PARTITION" = "0" ]; then
        pytest sgl-kernel/tests/test_dsv3_router_gemm.py
        pytest sgl-kernel/tests/test_per_token_quant_fp8.py
        pytest sgl-kernel/tests/speculative/test_eagle_utils.py
        pytest sgl-kernel/tests/speculative/test_ngram_utils.py
        pytest sgl-kernel/tests/speculative/test_speculative_sampling.py
        pytest sgl-kernel/tests/test_torch_defaults_reset.py
      fi

