    - .musa-registered-suite-job
  variables:
    MUSA_RUN_SUITE: "stage-a-test-1-gpu-musa-smoke"
    MUSA_SMOKE_COMMON_EXTRA_ARGS: "--disable-piecewise-cuda-graph --attention-backend fa3 --disable-overlap-schedule --chunked-prefill-size 2048"
    MUSA_SMOKE_QWEN_DENSE_MODEL: "/data/models/Qwen3-8B"
    MUSA_SMOKE_GSM8K_DATA_PATH: "/data/eval/gsm8k/test.jsonl"
