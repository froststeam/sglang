  stage: mr-summary
  extends:
    - .cpu-job
    - .rules-merge-request-always
  dependencies:
    - mr:musa-server-smoke:1gpu
    - mr:musa-server-smoke:qwen35-moe-no-ep-2gpu
    - mr:musa-server-smoke:joyai-llm-flash-4gpu
    - mr:musa-server-smoke:qwen35-35b-a3b-fp8-4gpu
    - mr:musa-server-smoke:gemma4-26b-a4b-it-4gpu
    - mr:musa-server-smoke:qwen3-vl-32b-4gpu
    - mr:musa-speculative-smoke:dspark-1gpu
    - mr:musa-speculative-smoke:eagle3-1gpu
    - mr:musa-speculative-smoke:ngram-1gpu
    - mr:musa-speculative-smoke:mtp-4gpu
  script:
    - python3 scripts/ci/musa/ci_summarize_smoke_artifacts.py
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci_artifacts/musa-smoke-summary/summary.md
      - ci_artifacts/musa-smoke-summary/summary.json
      - ci_artifacts/musa-smoke/
