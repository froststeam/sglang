.ci-default:
  interruptible: true
  before_script:
    - echo "CI_PROJECT_PATH=$CI_PROJECT_PATH"
    - echo "CI_COMMIT_REF_NAME=$CI_COMMIT_REF_NAME"
    - echo "CI_PIPELINE_SOURCE=$CI_PIPELINE_SOURCE"
    - export GITHUB_WORKSPACE="${CI_PROJECT_DIR:-$(pwd)}"
    - export GITHUB_PATH="${CI_PROJECT_DIR:-$(pwd)}/.gitlab_github_path"
    - export PATH="$HOME/.local/bin:$PATH"

.rules-disabled:
  rules:
    - when: never

.rules-daily-image:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $DAILY_IMAGE_BUILD == "1"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $DAILY_IMAGE_BUILD == "1"'
    - when: never

.rules-merge-request:
  rules:
    # Add target branches to this regex when enabling MR pipelines for more branches.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^musa\/(v0\.5\.10\.post1|0\.5\.12\.post1)$/'
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
        - scripts/ci/**/*
        - benchmark/musa/**/*
        - python/sglang/**/*
        - sgl-kernel/**/*
        - test/**/*
    - when: never

.rules-merge-request-always:
  rules:
    # Add target branches to this regex when enabling MR pipelines for more branches.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^musa\/(v0\.5\.10\.post1|0\.5\.12\.post1)$/'
      changes:
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
        - scripts/ci/**/*
        - benchmark/musa/**/*
        - python/sglang/**/*
        - sgl-kernel/**/*
        - test/**/*
      when: always
    - when: never

.rules-stage-a:
  rules:
    - when: never

.rules-stage-b:
  rules:
    - when: never

.rules-nightly:
  rules:
    - when: never

.musa-test-job:
  extends: .ci-default
  variables:
    HF_ENDPOINT: "https://hf-mirror.com"
    HF_HOME: "/data/hf-cache"
    HF_HUB_CACHE: "/data/hf-cache/hub"
    TRANSFORMERS_CACHE: "/data/hf-cache/hub"

.cpu-job:
  extends: .musa-test-job
  tags:
    - cpu-runner

.musa-1gpu-job:
  extends: .musa-test-job
  tags:
    - 1-gpu-runner

.musa-1gpu-test-job:
  extends: .musa-test-job
  tags:
    - 1-gpu-runner

.musa-2gpu-test-job:
  extends: .musa-test-job
  tags:
    - 2-gpu-runner

.musa-4gpu-test-job:
  extends: .musa-test-job
  tags:
    - 4-gpu-runner

.musa-install-dependency-job:
  stage: mr-setup
  timeout: 60m
  variables:
    PYTHONUSERBASE: "/data/gitlab-ci/python-user-base/${CI_PROJECT_PATH_SLUG}/${CI_COMMIT_SHA}"
  script:
    - mkdir -p ci_artifacts/musa-install-dependency
    - set -o pipefail; bash scripts/ci/musa/ci_install_dependency.sh 2>&1 | tee ci_artifacts/musa-install-dependency/install.log
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ci_artifacts/musa-install-dependency/

.musa-benchmark-correctness-job:
  stage: stage-a
  timeout: 30m
  variables:
    MUSA_BENCH_REPS: "3"
    PYTHONUSERBASE: "/data/gitlab-ci/python-user-base/${CI_PROJECT_PATH_SLUG}/${CI_COMMIT_SHA}"
  script:
    - source scripts/ci/musa/ci_setup_jit_cache.sh
    - bash scripts/ci/musa/ci_install_dependency.sh --system-deps-only
    - export PATH="${PYTHONUSERBASE}/bin:${PATH}"
    - python benchmark/musa/bench_quant_fp8.py --m-values 1,16,256 --hidden-values 128,1024,4096 --providers csrc --reps "$MUSA_BENCH_REPS" --skip-correctness
    - MS=1,8,64,512 TOPK=8 HIDDEN=7168 python benchmark/musa/moe/bench_moe_sum_reduce.py
    - python benchmark/musa/bench_act_and_mul.py --quick --dtypes float16 bfloat16 --warmup 2 --repeat "$MUSA_BENCH_REPS"

.musa-smoke-artifacts:
  after_script:
    - bash scripts/ci/musa/ci_collect_smoke_artifacts.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci_artifacts/musa-smoke/

.musa-registered-suite-job:
  extends:
    - .musa-smoke-artifacts
  stage: stage-a
  timeout: 30m
  variables:
    PYTHONUSERBASE: "/data/gitlab-ci/python-user-base/${CI_PROJECT_PATH_SLUG}/${CI_COMMIT_SHA}"
  script:
    - source scripts/ci/musa/ci_setup_jit_cache.sh
    - bash scripts/ci/musa/ci_install_dependency.sh --system-deps-only
    - export PATH="${PYTHONUSERBASE}/bin:${PATH}"
    - |
      if [ -n "${MUSA_RUN_SUITE_EXTRA_PIP_PACKAGES:-}" ]; then
        python3 -m pip install \
          --user \
          --index-url "${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}" \
          --timeout "${PIP_TIMEOUT:-30}" \
          --retries "${PIP_RETRIES:-2}" \
          --cache-dir "${PIP_CACHE_DIR:-/data/gitlab-ci/pip-cache}" \
          ${MUSA_RUN_SUITE_EXTRA_PIP_PACKAGES}
      fi
    - export MUSA_SMOKE_ARTIFACT_DIR="${CI_PROJECT_DIR:-$(pwd)}/ci_artifacts/musa-smoke/${CI_JOB_NAME_SLUG:-musa-smoke}"
    - export SGLANG_EVAL_REPORT_DIR="${MUSA_SMOKE_ARTIFACT_DIR}"
    - mkdir -p "${MUSA_SMOKE_ARTIFACT_DIR}"
    - touch "${MUSA_SMOKE_ARTIFACT_DIR}/.start"
    - cd test
    - python3 run_suite.py --hw musa --suite "$MUSA_RUN_SUITE" --timeout-per-file "${MUSA_RUN_SUITE_TIMEOUT_PER_FILE:-1200}"

.musa-registered-suite-python-overlay-job:
  extends:
    - .musa-smoke-artifacts
  stage: stage-a
  timeout: 30m
  variables:
    PYTHONUSERBASE: "/data/gitlab-ci/python-user-base/${CI_PROJECT_PATH_SLUG}/${CI_COMMIT_SHA}"
  script:
    - source scripts/ci/musa/ci_setup_jit_cache.sh
    - bash scripts/ci/musa/ci_install_dependency.sh --system-deps-only
    - export PATH="${PYTHONUSERBASE}/bin:${PATH}"
    - export MUSA_SMOKE_ARTIFACT_DIR="${CI_PROJECT_DIR:-$(pwd)}/ci_artifacts/musa-smoke/${CI_JOB_NAME_SLUG:-musa-smoke}"
    - export SGLANG_EVAL_REPORT_DIR="${MUSA_SMOKE_ARTIFACT_DIR}"
    - mkdir -p "${MUSA_SMOKE_ARTIFACT_DIR}"
    - touch "${MUSA_SMOKE_ARTIFACT_DIR}/.start"
    - bash scripts/ci/musa/ci_python_overlay.sh
    - source .musa_python_overlay.env
    - export PYTHONPATH="${MUSA_PYTHON_OVERLAY_DIR}:${PYTHONPATH:-}"
    - cd test
    - python3 run_suite.py --hw musa --suite "$MUSA_RUN_SUITE" --timeout-per-file "${MUSA_RUN_SUITE_TIMEOUT_PER_FILE:-1200}"

.musa-gemma4-26b-a4b-registered-suite-job:
  extends:
    - .musa-registered-suite-python-overlay-job
  variables:
    MUSA_RUN_SUITE: "stage-a-test-4-gpu-musa-gemma4-26b-a4b-smoke"
    MUSA_PYTHON_OVERLAY_NAME: "gemma4-26b-a4b"
    MUSA_PYTHON_OVERLAY_PACKAGES: "transformers==5.12.1 numpy<2 fsspec[http]<=2026.4.0,>=2023.1.0"
    MUSA_PYTHON_OVERLAY_VERIFY_MODULES: "transformers numpy"

.image-builder-job:
  extends: .ci-default
  tags:
    - image-builder
  variables:
    IMAGE_BUILD_SCRIPT: "/workspace/sglang_test/docker/build_infer_images.sh"
    IMAGE_BUILD_STATE_DIR: "/workspace/sglang_test/ci-state"
    SGLANG_SOURCE_REPO: "git@sh-code.mthreads.com:mcc-ai-serving/sglang.git"
    PUSH: "1"
    BUILD_BASE: "0"
    BUILD_MUSA_BASE: "0"
    BUILD_SGLANG: "1"
    BUILD_VLLM_MUSA: "0"
